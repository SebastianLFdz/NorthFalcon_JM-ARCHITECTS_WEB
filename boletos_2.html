    <section id="parallax">
        <h1>BOLETOS</h1>
        </section>
 

        <section id="formulario-compra" class="formulario-compra">
            <div class="container">
                <h2>¡Compra tus boletos ahora!</h2>
                <p>Por favor, ingresa tus datos para completar la compra.</p>
                
                <form action="pago.html" method="POST">
                    <!-- Nombre del comprador -->
                    <label for="nombre">Nombre Completo:</label>
                    <input type="text" id="nombre" name="nombre" required>
        
                    <!-- Correo electrónico -->
                    <label for="correo">Correo Electrónico:</label>
                    <input type="email" id="correo" name="correo" required>
        
                    <!-- Número de teléfono -->
                    <label for="telefono">Número de Teléfono:</label>
                    <input type="tel" id="telefono" name="telefono" pattern="[0-9]{10}" required placeholder="1234567890">
        
                    <!-- Número de boletos -->
                    <label for="boletos">Cantidad de Boletos:</label>
                    <input type="number" id="boletos" name="boletos" min="1" max="10" value="1" required>
        
                    <a href="felicidades.html">
                        <button type="button" class="boton">Proceder al pago</button>
                    </a>                    
                </form>
            </div>
        </section>
