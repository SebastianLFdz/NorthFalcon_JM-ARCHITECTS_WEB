{% extends "base.html" %}
{% block content %}
<section class="contacto-parallax acceso">
    <div class="formulario">
        <i class="fa-solid fa-user-lock acceso-icono" aria-hidden="true"></i>
        <h3>Acceso Personal Autorizado</h3>
        <form method="post" action="{{ url_for('login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="usuario">Usuario:</label>
            <input type="text" id="usuario" name="usuario" required maxlength="80" autocomplete="username">

            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">

            <button type="submit">Iniciar sesión</button>
        </form>
        {% if error %}<p class="acceso-error">{{ error }}</p>{% endif %}
    </div>
</section>
{% endblock %}
