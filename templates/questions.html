{% extends "base.html" %}
{% block content %}
<section id="parallax">
    <h1>PREGUNTAS FRECUENTES</h1>
</section>
<section class="preguntas-frecuentes">
    <h2>¿QUÉ NECESITAS SABER?</h2>
    <div class="faq">
        {% for pregunta, respuesta in faqs %}
        <div class="faq-item">
            <button class="faq-question" type="button" aria-expanded="false">{{ pregunta }}</button>
            <div class="faq-answer"><p>{{ respuesta }}</p></div>
        </div>
        {% endfor %}
    </div>
</section>
{% endblock %}
