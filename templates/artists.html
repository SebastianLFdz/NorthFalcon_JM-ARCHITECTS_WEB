{% extends "base.html" %}{% block content %}<section id="parallax"><h1>PROYECTOS</h1><h3>Trabajo, territorio y decisiones con una base clara</h3></section><section class="artistas"><h2>Proyectos y colaboraciones</h2><div class="artistas-grid">{% for artist in artists %}<article class="artista"><img src="{{ url_for('static', filename=artist.image) }}" alt="{{ artist.name }}"><h3>{{ artist.name }}</h3><p>{{ artist.genre }}</p><div class="redes-sociales"><a href="{{ url_for('contact') }}">Consultar proyecto</a></div></article>{% endfor %}</div></section>{% endblock %}
